<!DOCTYPE html>
<html lang="en"><head><title>Login | EGS Chronos</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="nav"></div>
<main class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="index.html"><span class="mark">C</span><span>EGS <b>CHRONOS</b></span></a>
    <div class="eyebrow">College Access</div>
    <h1>Welcome back.</h1>
    <p class="muted">Use a demo account to explore the prototype.</p>
    <div class="field"><label>Email / ID</label><input id="email" type="email" placeholder="student@egs.edu"></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="********"></div>
    <div class="field"><label>Role</label>
      <select id="role"><option value="student">Student</option><option value="faculty">Faculty</option><option value="admin">Admin</option></select></div>
    <button class="btn btn-dark btn-block" id="loginBtn">Login &rarr;</button>
    <div class="error" id="err"></div>
    <div class="hint"><b>Demo accounts</b><br>
      Student: <code>student@egs.edu</code> / <code>student123</code><br>
      Faculty: <code>faculty@egs.edu</code> / <code>faculty123</code><br>
      Admin: <code>admin@egs.edu</code> / <code>admin123</code></div>
    <div class="auth-foot">New student? <a href="register.html">Create your profile</a></div>
  </div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
  renderNav("login");
  function doLogin() {
    const r = login(email.value, password.value, role.value);
    if (!r.ok) { err.textContent = r.msg; return; }
    location.href = r.user.role === "student" ? "dashboard.html" : "admin.html";
  }
  loginBtn.onclick = doLogin;
  password.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body></html>
